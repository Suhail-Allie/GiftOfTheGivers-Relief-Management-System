trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'
  solution: 'GiftOfTheGivers.slnx'
  testProject: 'GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj'

pool:
  vmImage: 'windows-latest'

stages:

- stage: Build
  displayName: 'Build Solution'
  jobs:
  - job: BuildJob
    displayName: 'Restore and Build'
    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet packages'
      inputs:
        command: 'restore'
        projects: '$(solution)'
        feedsToUse: 'select'
        includeNuGetOrg: true

    - task: DotNetCoreCLI@2
      displayName: 'Build solution'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

- stage: Test
  displayName: 'Run Automated Tests'
  dependsOn: Build
  jobs:
  - job: TestJob
    displayName: 'Run xUnit Tests'
    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - task: DotNetCoreCLI@2
      displayName: 'Run automated tests'
      inputs:
        command: 'test'
        projects: '$(testProject)'
        arguments: '--configuration $(buildConfiguration)'
        publishTestResults: true
        testRunTitle: 'Gift of the Givers Automated Tests'